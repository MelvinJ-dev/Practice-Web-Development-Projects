<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizer</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <h1>Binary search Visualizer</h1>
        <form action="">
          <input type="text" placeholder="Enter the sorted list" required />
          <input type="number" placeholder="Enter the target" required />
        </form>
        <div class="numbers">
          <div class="num">18</div>
          <div class="num">25</div>
          <div class="num">32</div>
          <div class="num">46</div>
          <div class="num">54</div>
          <div class="num">55</div>
          <div class="num">64</div>
          <div class="num">77</div>
          <div class="num">86</div>
          <div class="num">94</div>
        </div>
        <div class="output-box" id="output">Result will appear here...</div></div>
      </div>
  </div>
  </body>
</html>
