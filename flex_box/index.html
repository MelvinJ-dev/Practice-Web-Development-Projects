<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Flexbox Masterclass Demo</h1>
      <div class="content">
        <div class="box">
          <h2>1. Default Flex (row)</h2>
          <div class="circle">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
          </div>
        </div>
        <div class="box">
          <h2>2.Flex Direction:Column</h2>
          <div class="circle" style="flex-direction: column">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
          </div>
        </div>
        <div class="box">
          <h2>3.Justify-Content-space</h2>
          <div class="circle" style="justify-content: left">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
          </div>
        </div>
        <div class="box">
          <h2>4.Align items: Center</h2>
          <div class="circle" style="align-items: center">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
          </div>
        </div>
        <div class="box">
          <h2>5.Flex Wrap: Wrap</h2>
          <div class="circle">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>10</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
